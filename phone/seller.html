<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>يومية الفرع</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--g:#b08328;--g2:#7f5d17;--bg:#fbf9f4;--card:#fff;--ink:#241e12;--mut:#7a705c;--line:#eadfca;--ok:#0b6b45;--bad:#b33}
@media(prefers-color-scheme:dark){:root{--bg:#14110b;--card:#1f1a10;--ink:#f3ead6;--mut:#b5a888;--line:#3a3220}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 Cairo,Tahoma,sans-serif;padding:0 0 90px}
header{background:linear-gradient(135deg,#17140f,#2b2418);color:#f3d48a;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:19px}header small{color:#e8dcc0}
main{padding:12px 16px;max-width:620px;margin:0 auto}
.tabs{display:flex;gap:6px;margin:4px 0 12px}.tabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 6px;font:700 15px Cairo;cursor:pointer}.tabs button.on{background:var(--g);border-color:var(--g);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:6px 0 2px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font:16px Cairo}
.row{display:flex;gap:6px;align-items:flex-end;margin-bottom:6px}.row>*{flex:1;min-width:0}.row .sm{flex:0 0 74px}.row .x{flex:0 0 40px;background:#fdecec;color:var(--bad);border:0;border-radius:10px;height:44px;font-size:18px}
button.main{width:100%;border:0;background:linear-gradient(135deg,#d4aa4f,#9c7020);color:#fff;border-radius:14px;padding:14px;font:800 17px Cairo;cursor:pointer;box-shadow:0 8px 20px #9c702040}
button.add{border:1px dashed var(--g);background:transparent;color:var(--g2);border-radius:10px;padding:8px 12px;font:700 14px Cairo;cursor:pointer}
.msg{padding:10px 12px;border-radius:12px;margin:8px 0;font-weight:700}.ok{background:#e3f4ec;color:var(--ok)}.er{background:#fdecec;color:var(--bad)}.warn{background:#fff4e0;color:#a66a00}
.tot{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}.tot b{font-size:17px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.drop{display:block;text-align:center;border:2px dashed var(--g);border-radius:16px;padding:24px 12px;color:var(--g2);font-weight:800;cursor:pointer}
.item{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}.item:last-child{border:0}
</style>
</head>
<body>
<header><h1 id="hT">يومية الفرع</h1><small id="hS"></small></header>
<main id="app"><div class="msg warn">⏳ بيتحقق من اللينك…</div></main>
<script>
const SB='https://rzvncstjattlklpdtkfn.supabase.co',KEY='sb_publishable_Molr1fCzsC-VbSgTFDXc5w_F1p0-Fcr';
const TOKEN=new URLSearchParams(location.search).get('k')||'';
const $=id=>document.getElementById(id),H=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ND=v=>String(v??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));const num=v=>{const n=parseFloat(ND(v).replace(/[,٬\s]/g,''));return isNaN(n)?0:n};
const M=n=>(Math.round((+n||0)*100)/100).toLocaleString('ar-EG')+' ج';
async function rpc(fn,args){const r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});const t=await r.text();let j;try{j=JSON.parse(t)}catch(e){j=t}if(!r.ok)throw new Error((j&&j.message)||'حصلت مشكلة');return j}
let INFO=null,TAB='j',DAY='',SENT=[],ROWS={sales:[{item:'',qty:1,price:'',pay:'cash'}],exp:[{note:'',amt:''}],cash:'',note:''},SHOTS=[],BUSY=false;
async function boot(){if(!TOKEN){$('app').innerHTML='<div class="msg er">اللينك ناقص — اطلب من صاحب المحل يبعتهولك تاني</div>';return}
 try{INFO=await rpc('ph_seller_info',{p_token:TOKEN})}catch(e){$('app').innerHTML='<div class="msg er">'+H(e.message)+'</div>';return}
 if(!INFO.ok){$('app').innerHTML='<div class="msg er">'+H(INFO.msg||'اللينك مش شغال')+'</div>';return}
 DAY=INFO.today;$('hT').textContent=INFO.shop?INFO.shop+' — '+INFO.branch:INFO.branch;$('hS').textContent='يومية '+DAY;await load();draw()}
async function load(){try{SENT=await rpc('ph_seller_today',{p_token:TOKEN,p_day:DAY})}catch(e){SENT=[]}}
function draw(){const sent=SENT.filter(x=>x.kind==='journal').length,shots=SENT.filter(x=>x.kind==='shot').length;
 $('app').innerHTML=`<div class="tabs">${[['j','📒 اليومية'],['s','📷 سكرينات'],['d','📋 اللي اتبعت ('+SENT.length+')']].map(([k,l])=>`<button class="${TAB===k?'on':''}" onclick="TAB='${k}';draw()">${l}</button>`).join('')}</div>${TAB==='j'?jHtml():TAB==='s'?sHtml():dHtml()}`;}
function jHtml(){const sales=ROWS.sales,tot={cash:0,wal:0,credit:0};sales.forEach(r=>{const v=num(r.qty)*num(r.price);tot[r.pay==='cash'?'cash':r.pay==='wal'?'wal':'credit']+=v});const ex=ROWS.exp.reduce((a,r)=>a+num(r.amt),0);
 return `<div class="card"><b>🛒 اللي اتباع النهارده</b>${sales.map((r,i)=>`<div class="row" style="margin-top:8px"><div><label>الصنف</label><input value="${H(r.item)}" oninput="ROWS.sales[${i}].item=this.value"></div><div class="sm"><label>العدد</label><input inputmode="decimal" value="${H(r.qty)}" oninput="ROWS.sales[${i}].qty=this.value;tot()"></div><div class="sm"><label>السعر</label><input inputmode="decimal" value="${H(r.price)}" oninput="ROWS.sales[${i}].price=this.value;tot()"></div></div><div class="row"><div><select onchange="ROWS.sales[${i}].pay=this.value;tot()"><option value="cash" ${r.pay==='cash'?'selected':''}>💵 نقدي</option><option value="wal" ${r.pay==='wal'?'selected':''}>📲 محفظة / انستا</option><option value="credit" ${r.pay==='credit'?'selected':''}>📝 آجل</option></select></div>${sales.length>1?`<button class="x" onclick="ROWS.sales.splice(${i},1);draw()">✕</button>`:''}</div>`).join('')}<button class="add" onclick="ROWS.sales.push({item:'',qty:1,price:'',pay:'cash'});draw()">➕ صنف</button></div>
 <div class="card"><b>💸 مصروفات (نقل، أكل، سلف…)</b>${ROWS.exp.map((r,i)=>`<div class="row" style="margin-top:8px"><div><label>البيان</label><input value="${H(r.note)}" oninput="ROWS.exp[${i}].note=this.value"></div><div class="sm"><label>المبلغ</label><input inputmode="decimal" value="${H(r.amt)}" oninput="ROWS.exp[${i}].amt=this.value;tot()"></div>${ROWS.exp.length>1?`<button class="x" onclick="ROWS.exp.splice(${i},1);draw()">✕</button>`:''}</div>`).join('')}<button class="add" onclick="ROWS.exp.push({note:'',amt:''});draw()">➕ مصروف</button></div>
 <div class="card"><div id="tt">${totHtml(tot,ex)}</div><label>الفلوس اللي في الدرج فعلاً دلوقتي</label><input inputmode="decimal" value="${H(ROWS.cash)}" oninput="ROWS.cash=this.value;tot()"><label>ملاحظات</label><textarea rows="2" oninput="ROWS.note=this.value">${H(ROWS.note)}</textarea></div>
 <button class="main" id="jb" onclick="sendJ()">📤 ابعت اليومية لصاحب المحل</button>${sent()}`}
const sent=()=>SENT.some(x=>x.kind==='journal')?'<div class="msg warn">اتبعت يومية النهارده قبل كده — لو بعت تاني هتتحسب يومية إضافية</div>':'';
function totHtml(t,ex){const exp=t.cash-ex,c=num(ROWS.cash);return `<div class="tot"><span>مبيعات نقدي</span><b>${M(t.cash)}</b></div><div class="tot"><span>مبيعات محفظة/انستا</span><b>${M(t.wal)}</b></div><div class="tot"><span>آجل</span><b>${M(t.credit)}</b></div><div class="tot"><span>مصروفات</span><b>${M(ex)}</b></div><div class="tot"><span>المفروض في الدرج (من النقدي − المصروف)</span><b>${M(exp)}</b></div>${ROWS.cash!==''?`<div class="tot"><span>الفرق</span><b style="color:${Math.abs(c-exp)<1?'var(--ok)':'var(--bad)'}">${Math.abs(c-exp)<1?'✔ مظبوط':M(c-exp)}</b></div>`:''}`}
function tot(){const t={cash:0,wal:0,credit:0};ROWS.sales.forEach(r=>{const v=num(r.qty)*num(r.price);t[r.pay==='cash'?'cash':r.pay==='wal'?'wal':'credit']+=v});const el=$('tt');if(el)el.innerHTML=totHtml(t,ROWS.exp.reduce((a,r)=>a+num(r.amt),0))}
async function sendJ(){if(BUSY)return;const sales=ROWS.sales.filter(r=>r.item.trim()&&num(r.price)),exp=ROWS.exp.filter(r=>num(r.amt));if(!sales.length&&!exp.length&&ROWS.cash==='')return alert('اكتب صنف واحد على الأقل أو الفلوس اللي في الدرج');
 BUSY=true;$('jb').textContent='⏳ بيبعت…';try{await rpc('ph_seller_send',{p_token:TOKEN,p_day:DAY,p_kind:'journal',p_payload:{sales:sales.map(r=>({item:r.item.trim(),qty:num(r.qty),price:num(r.price),pay:r.pay})),exp:exp.map(r=>({note:r.note.trim(),amt:num(r.amt)})),cash:ROWS.cash===''?null:num(ROWS.cash),note:ROWS.note.trim()},p_image:''});
  ROWS={sales:[{item:'',qty:1,price:'',pay:'cash'}],exp:[{note:'',amt:''}],cash:'',note:''};await load();TAB='d';draw();$('app').insertAdjacentHTML('afterbegin','<div class="msg ok">✔ اليومية وصلت لصاحب المحل</div>')}catch(e){alert(e.message);$('jb').textContent='📤 ابعت اليومية لصاحب المحل'}BUSY=false}
/* السكرينات */
function ahash(img){const c=document.createElement('canvas');c.width=9;c.height=8;const x=c.getContext('2d');x.drawImage(img,0,0,9,8);const d=x.getImageData(0,0,9,8).data,g=[];for(let i=0;i<d.length;i+=4)g.push(d[i]*.3+d[i+1]*.59+d[i+2]*.11);let h='';for(let y=0;y<8;y++)for(let k=0;k<8;k++)h+=g[y*9+k]>g[y*9+k+1]?'1':'0';return h}
const ham=(a,b)=>{let n=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])n++;return n};
function sHtml(){return `<label class="drop">📷 اختار السكرينات (تقدر تختار كذا واحدة مع بعض)<input type="file" accept="image/*" multiple hidden onchange="addShots(this.files)"></label>
 ${SHOTS.length?`<div class="card" style="margin-top:12px"><b>${SHOTS.length} سكرينة جاهزة للإرسال</b>${SHOTS.map((s,i)=>`<div class="item"><img src="${s.data}" style="width:60px;height:60px;object-fit:cover;border-radius:10px"><div style="flex:1"><input placeholder="المبلغ (لو عارفه)" inputmode="decimal" value="${H(s.amt||'')}" oninput="SHOTS[${i}].amt=this.value"><div style="font-size:12px;color:${s.dup?'var(--bad)':'var(--mut)'}">${s.dup?'⛔ السكرينة دي اتبعتت قبل كده':''}</div></div><button class="x" style="background:#fdecec;color:var(--bad);border:0;border-radius:10px;width:40px;height:40px" onclick="SHOTS.splice(${i},1);draw()">✕</button></div>`).join('')}<button class="main" style="margin-top:10px" id="sb" onclick="sendS()">📤 ابعت ${SHOTS.filter(s=>!s.dup).length} سكرينة</button></div>`:''}`}
async function addShots(fl){for(const f of [...fl].slice(0,20)){const u=URL.createObjectURL(f),im=await new Promise(ok=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ok(null);i.src=u});if(!im)continue;const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const h=ahash(im);URL.revokeObjectURL(u);
  const dup=SENT.some(x=>x.kind==='shot'&&x.payload&&x.payload.hash&&ham(x.payload.hash,h)<=4)||SHOTS.some(x=>ham(x.hash,h)<=4);SHOTS.push({data:c.toDataURL('image/jpeg',.6),hash:h,amt:'',dup})}draw()}
async function sendS(){if(BUSY)return;const L=SHOTS.filter(s=>!s.dup);if(!L.length)return;BUSY=true;let n=0;for(const s of L){try{await rpc('ph_seller_send',{p_token:TOKEN,p_day:DAY,p_kind:'shot',p_payload:{hash:s.hash,amt:num(s.amt)||null},p_image:s.data});n++;$('sb').textContent='⏳ '+n+' / '+L.length}catch(e){alert(e.message);break}}
 SHOTS=[];BUSY=false;await load();TAB='d';draw();$('app').insertAdjacentHTML('afterbegin','<div class="msg ok">✔ وصل '+n+' سكرينة</div>')}
function dHtml(){return `<div class="card">${SENT.map(x=>`<div class="item"><div style="font-size:24px">${x.kind==='journal'?'📒':x.kind==='shot'?'📷':'📝'}</div><div style="flex:1"><b>${x.kind==='journal'?'يومية':x.kind==='shot'?'سكرينة'+(x.payload.amt?' — '+M(x.payload.amt):''):'ملاحظة'}</b><br><small style="color:var(--mut)">${new Date(x.at).toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'})}${x.kind==='journal'&&x.payload.sales?' · '+x.payload.sales.length+' صنف':''}</small></div><span style="font-size:13px;font-weight:800;color:${x.reviewed?'var(--ok)':'var(--mut)'}">${x.reviewed?'✔ اتراجعت':'مستني'}</span></div>`).join('')||'<div style="text-align:center;color:var(--mut)">لسه ماتبعتش حاجة النهارده</div>'}</div><button class="add" onclick="load().then(draw)">🔄 تحديث</button>`}
boot();
</script>
</body>
</html>
