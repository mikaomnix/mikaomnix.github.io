<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>لوحة الاشتراكات | Mika Omnix</title>
<meta name="theme-color" content="#087f8c"><link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>(function(){const P='mkapp:',S=Storage.prototype,g=S.getItem,s=S.setItem,r=S.removeItem;S.getItem=function(k){return g.call(this,P+k)};S.setItem=function(k,v){return s.call(this,P+k,v)};S.removeItem=function(k){return r.call(this,P+k)}})();</script>
<style>
:root{--bg:#f3f6f7;--card:#fff;--fg:#17363b;--mut:#61777b;--line:#dfe7e9;--pri:#087f8c;--ok:#1f8a4c;--warn:#b7791f;--bad:#c0392b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Cairo,system-ui,sans-serif;font-size:15px}
header{background:var(--pri);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1}header button{background:#ffffff26;color:#fff;border:0;border-radius:10px;padding:8px 12px;font:inherit;font-weight:700}
main{max-width:1000px;margin:0 auto;padding:14px 16px 60px}
.box{background:var(--card);border-radius:18px;padding:22px;max-width:380px;margin:40px auto;box-shadow:0 6px 24px #0001}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit;margin:6px 0;background:#fff;color:var(--fg)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer}
.btn.s{padding:7px 11px;font-size:13px;border-radius:10px}.btn.g{background:var(--ok)}.btn.w{background:#fff;color:var(--fg);border:1px solid var(--line)}.btn.r{background:var(--bad)}
.err{color:var(--bad);min-height:20px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stats div{background:var(--card);border-radius:14px;padding:12px;text-align:center}.stats b{display:block;font-size:24px}.stats small{color:var(--mut)}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tools input{flex:1;min-width:180px;margin:0}.tools select{width:auto;margin:0}
.sub{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;border-right:5px solid var(--line)}
.sub.trial{border-color:var(--warn)}.sub.active{border-color:var(--ok)}.sub.expired,.sub.blocked{border-color:var(--bad)}
.sub .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.sub h3{margin:0;font-size:17px}.sub .em{color:var(--mut);font-size:13px;direction:ltr;text-align:right}
.tag{border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:800;white-space:nowrap}
.tag.trial{background:#fff3d6;color:var(--warn)}.tag.active{background:#dff3e6;color:var(--ok)}.tag.expired,.tag.blocked{background:#fbe1de;color:var(--bad)}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin:8px 0}.meta b{color:var(--fg)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.wa{background:#25D366}
.empty{text-align:center;color:var(--mut);padding:40px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head>
<body>
<header><img src="icon-192.png" alt="" style="width:34px;height:34px;border-radius:9px"><h1>لوحة الاشتراكات</h1><button id="rf" hidden>🔄 تحديث</button><button id="out" hidden>خروج</button></header>
<main id="app">
 <div class="box" id="login"><h2 style="margin-top:0">دخول المدير</h2>
  <input id="em" type="email" placeholder="الإيميل" autocomplete="username">
  <input id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password">
  <div class="err" id="er"></div><button class="btn" id="go" style="width:100%">دخول</button></div>
 <div id="panel" hidden>
  <div class="stats" id="st"></div>
  <div class="tools"><input id="q" placeholder="🔎 دوّر باسم المحل أو الموبايل أو الإيميل"><select id="f"><option value="">الكل</option><option value="trial">تجريبي</option><option value="active">مفعّل</option><option value="expired">منتهي</option><option value="blocked">موقوف</option></select></div>
  <div id="list"></div>
 </div>
</main>
<script>
const SB_URL='https://rzvncstjattlklpdtkfn.supabase.co',SB_KEY='sb_publishable_Molr1fCzsC-VbSgTFDXc5w_F1p0-Fcr';
const sb=supabase.createClient(SB_URL,SB_KEY),$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=d=>d?new Date(d).toLocaleDateString('ar-EG',{day:'numeric',month:'short',year:'numeric'}):'—';
const ago=d=>{if(!d)return 'لسه';const m=(Date.now()-new Date(d))/60000;return m<60?'من '+Math.max(1,Math.round(m))+' دقيقة':m<1440?'من '+Math.round(m/60)+' ساعة':'من '+Math.round(m/1440)+' يوم'};
const L={trial:'تجريبي',active:'مفعّل',expired:'منتهي',blocked:'موقوف'};
let ALL=[];
function status(s){const n=Date.now();if(s.blocked)return 'blocked';if(s.paid_until&&new Date(s.paid_until)>n)return 'active';if(new Date(s.trial_end)>n)return 'trial';return 'expired'}
function left(d){return Math.max(0,Math.ceil((new Date(d)-Date.now())/864e5))}
function waNum(p){p=String(p||'').replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);if(p.startsWith('0'))p='2'+p;return p}
async function login(){$('er').textContent='';const r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
 if(r.error){$('er').textContent='الإيميل أو كلمة السر غلط';return}$('pw').value='';load()}
async function load(){const r=await sb.rpc('app_admin_list');
 if(r.error){if(/not_admin/.test(r.error.message||'')){$('er').textContent='الحساب ده مش مدير';await sb.auth.signOut()}else $('er').textContent='مشكلة اتصال: '+r.error.message;show(false);return}
 ALL=(r.data||[]).map(s=>Object.assign(s,{st:status(s)}));show(true);render()}
function show(on){$('login').hidden=on;$('panel').hidden=!on;$('rf').hidden=$('out').hidden=!on}
function render(){const c=k=>ALL.filter(s=>s.st===k).length;
 $('st').innerHTML=`<div><b>${ALL.length}</b><small>كل المشتركين</small></div><div><b style="color:var(--ok)">${c('active')}</b><small>مفعّل</small></div><div><b style="color:var(--warn)">${c('trial')}</b><small>تجريبي</small></div><div><b style="color:var(--bad)">${c('expired')+c('blocked')}</b><small>منتهي / موقوف</small></div>`;
 const q=$('q').value.trim().toLowerCase(),f=$('f').value;
 const rows=ALL.filter(s=>(!f||s.st===f)&&(!q||[s.shop,s.phone,s.email].join(' ').toLowerCase().includes(q)));
 $('list').innerHTML=rows.length?rows.map(s=>{const st=s.st;
  const when=st==='active'?'مفعّل لحد <b>'+fd(s.paid_until)+'</b> (باقي '+left(s.paid_until)+' يوم)':st==='trial'?'التجربة بتخلص <b>'+fd(s.trial_end)+'</b> (باقي '+left(s.trial_end)+' يوم)':st==='expired'?'خلص <b>'+fd(s.paid_until||s.trial_end)+'</b>':'موقوف';
  return `<div class="sub ${st}"><div class="top"><div><h3>${esc(s.shop||'(من غير اسم)')}</h3><div class="em">${esc(s.email)}${s.phone?' • '+esc(s.phone):''}</div></div><span class="tag ${st}">${L[st]}</span></div>
  <div class="meta"><span>${when}</span><span>سجّل <b>${fd(s.created_at)}</b></span><span>آخر دخول <b>${ago(s.last_seen)}</b></span><span>📦 <b>${s.products}</b> صنف</span><span>🧾 <b>${s.sales}</b> فاتورة بيع</span></div>
  ${s.note?`<div class="meta">📝 ${esc(s.note)}</div>`:''}
  <div class="acts">
   <button class="btn s g" onclick="act('${s.owner}',30)">✅ شهر</button>
   <button class="btn s g" onclick="act('${s.owner}',90)">3 شهور</button>
   <button class="btn s g" onclick="act('${s.owner}',365)">سنة</button>
   ${s.blocked?`<button class="btn s w" onclick="act('${s.owner}',null,false)">▶️ تشغيل</button>`:`<button class="btn s r" onclick="act('${s.owner}',null,true)">⛔ إيقاف</button>`}
   ${s.paid_until?`<button class="btn s w" onclick="act('${s.owner}',0)">إلغاء التفعيل</button>`:''}
   <button class="btn s w" onclick="note('${s.owner}')">📝 ملاحظة</button>
   ${s.phone?`<a class="btn s wa" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${waNum(s.phone)}">واتساب</a>`:''}
  </div></div>`}).join(''):'<div class="empty">مفيش مشتركين هنا</div>'}
async function act(id,days,blocked){const s=ALL.find(x=>x.owner===id);
 const msg=days>0?`تفعيل «${s.shop||s.email}» ${days===30?'شهر':days===90?'3 شهور':'سنة'}؟`:days===0?'إلغاء التفعيل؟ (هيرجع للتجربة لو لسه فيها، أو يتقفل)':blocked?'إيقاف الحساب؟ هيتقفل عنده فوراً':'تشغيل الحساب تاني؟';
 if(!confirm(msg))return;
 const r=await sb.rpc('app_admin_set',{p_owner:id,p_days:days,p_blocked:blocked==null?null:blocked});
 if(r.error){alert('مشكلة: '+r.error.message);return}load()}
async function note(id){const s=ALL.find(x=>x.owner===id);const n=prompt('ملاحظة (مثلاً: دفع 300 ج فودافون كاش)',s.note||'');if(n==null)return;
 const r=await sb.rpc('app_admin_set',{p_owner:id,p_note:n});if(r.error){alert(r.error.message);return}load()}
$('go').onclick=login;$('pw').onkeydown=e=>{if(e.key==='Enter')login()};
$('rf').onclick=load;$('out').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('q').oninput=render;$('f').onchange=render;
sb.auth.getSession().then(x=>{if(x.data.session)load()});
</script>
</body></html>
