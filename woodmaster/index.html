	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];

	get : function(index) {

	getLength : function() {
		return this.num.length;

	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);

function impC(){const L=D('piece').filter(x=>x.proj==$('#cj').value);if(!L.length)return alert('لا توجد قطع لهذا المشروع في قائمة التقطيع');$('#cl').value=L.map(x=>`${x.l} ${x.w} ${x.q}`).join('\n')}
function place(s,p,k,rot){let b=null;s.free.forEach((f,i)=>{(rot?[0,1]:[0]).forEach(o=>{const w=o?p.h:p.w,h=o?p.w:p.h;if(w<=f.w+1e-9&&h<=f.h+1e-9){const sc=Math.min(f.w-w,f.h-h);if(!b||sc<b.sc)b={i,w,h,sc,f}}})});
 if(!b)return false;const{f,w,h}=b;s.items.push({x:f.x,y:f.y,w,h,n:p.n});s.free.splice(b.i,1);
 const r=f.w-w<f.h-h?[{x:f.x+w+k,y:f.y,w:f.w-w-k,h:h},{x:f.x,y:f.y+h+k,w:f.w,h:f.h-h-k}]:[{x:f.x+w+k,y:f.y,w:f.w-w-k,h:f.h},{x:f.x,y:f.y+h+k,w:w,h:f.h-h-k}];
 r.forEach(q=>{if(q.w>.5&&q.h>.5)s.free.push(q)});return true}
function pack(list,W,H,k,rot,cmp){const sh=[];for(const p of list.slice().sort(cmp)){if(!sh.some(s=>place(s,p,k,rot))){const s={free:[{x:0,y:0,w:W,h:H}],items:[]};sh.push(s);place(s,p,k,rot)}}
 const used=sh.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.w*i.h,0),0),tot=sh.length*W*H;return{sh,used,tot,u:used/tot*100}}
function runCut(){CUT.W=+$('#cw').value;CUT.H=+$('#ch').value;CUT.k=+$('#ck').value;CUT.price=+$('#cp').value;CUT.list=$('#cl').value;CUT.g=$('#cg').checked;
 const{W,H,k,g}=CUT,L=[];let bad='';
 CUT.list.split('\n').forEach((ln,ix)=>{if(!ln.trim())return;const n=ln.trim().split(/[\s,x×*]+/).map(Number);if(n.length<2||n.some(isNaN)){bad=`السطر ${ix+1} غير صحيح: اكتب طول وعرض وعدد`;return}
  if(!(n[0]<=W&&n[1]<=H)&&(g||!(n[0]<=H&&n[1]<=W))){bad=`القطعة ${n[0]}×${n[1]} أكبر من اللوح`;return}for(let i=0;i<(n[2]||1);i++)L.push({w:n[0],h:n[1],n:`${n[0]}×${n[1]}`})});
 if(bad)return $('#cres').innerHTML=`<div class="card" style="color:var(--bad)">${bad}</div>`;if(!L.length)return $('#cres').innerHTML='<div class="card empty">أضف قطعة واحدة على الأقل.</div>';

 const minS=Math.min(...R.map(r=>r.sh.length)),bu=R.reduce((a,r)=>r.u>a.u?r:a,R[0]),fw=R.filter(r=>r.sh.length==minS).reduce((a,r)=>r.u>a.u?r:a),rs=R.filter(r=>r!=bu&&r!=fw).sort((a,b)=>b.u-a.u)[0]||bu;
 window._P=[['الخطة 1: أقل هالك',bu],['الخطة 2: أقل عدد ألواح',fw],['الخطة 3: بديلة',rs]];CUT.plan=0;showPlan()}

function applyR(r){const p=D('proj').find(x=>x.code==r.proj);if(!p)return;p.total=(+p.total||0)+(+r.diff||0);if(r.days&&p.due)p.due=addD(p.due,+r.days);Object.assign(r,{applied:true,appDiff:+r.diff||0,appDays:+r.days||0,appProj:p.code})}

 const corners=KT.corners===''?Math.max(0,W.length-1):+KT.corners;let low=[],up=[],tall=[],walls=[];let tallLeft=+KT.tall||0,drLeft=+KT.drawers||0,sinkDone=!KT.sink,hoodDone=!KT.hood;
 W.forEach((len,i)=>{let L=len;const w={len,low:[],up:[],tall:[]};
  if(i<corners){L-=100;w.low.push({w:100,t:'ركنة',corner:1})}
  if(tallLeft>0&&i===W.length-1){const n=Math.min(tallLeft,Math.floor(L/60));for(let k=0;k<n;k++){w.tall.push({w:60,t:'دولاب طويل'});L-=60}tallLeft-=n}
  const s=ktSplit(L);s.u.forEach(x=>{let t='وحدة';if(!sinkDone&&x>=60){t='حوض';sinkDone=true}else if(drLeft>0&&x>=40){t='أدراج';drLeft--}w.low.push({w:x,t})});w.fill=s.fill;
  let UL=(UW[i]||len)-(i<corners?60:0)-w.tall.reduce((a,x)=>a+x.w,0);if(i<corners)w.up.push({w:60,t:'ركنة',corner:1});
  const su=ktSplit(UL);su.u.forEach(x=>{let t='علوي';if(!hoodDone&&x===60){t='شفاط';hoodDone=true}w.up.push({w:x,t})});walls.push(w);low=low.concat(w.low);up=up.concat(w.up);tall=tall.concat(w.tall)});
 const H=+KT.lowH,D=+KT.dep,UH=+KT.upH,UD=+KT.upD,doorsOf=u=>u.t==='أدراج'||u.t==='شفاط'?0:u.w>=80?2:1,hingeOf=h=>h<=95?2:h<=160?3:4;
 let doors=0,hinges=0,drawers=0,shelves=0,legs=0,carc=0,back=0,front=0,band=0;const P=[];const add=(unit,name,l,w,q,mat,th)=>P.push({unit,name,l:Math.round(l),w:Math.round(w),q,mat,th});
 low.forEach((u,i)=>{const n=doorsOf(u),tag='سفلي '+u.t+' '+u.w;doors+=n;hinges+=n*hingeOf(H);if(u.t==='أدراج')drawers+=3;const sh=u.t==='أدراج'||u.t==='حوض'?0:1;shelves+=sh;legs+=4;
  carc+=2*H*D+2*u.w*D+sh*u.w*D;back+=u.w*H;front+=u.w*H;band+=2*H+2*u.w+sh*u.w+(n?n*2*(u.w/n+H):3*2*(u.w+H/3));
  add(tag,'جنب',H,D,2,'خشب 18',18);add(tag,'أرضية',u.w-3.6,D,1,'خشب 18',18);add(tag,'مرابط فوق',u.w-3.6,10,2,'خشب 18',18);if(sh)add(tag,'رف',u.w-3.8,D-3,sh,'خشب 18',18);add(tag,'ضهر',u.w-1,H-1,1,'HDF',3);
  if(u.t==='أدراج'){add(tag,'وش درج',u.w-.4,H/3-.4,3,'وش',18)}else if(n)add(tag,'ضلفة',u.w/n-.4,H-.4,n,'وش',18)});
 up.forEach(u=>{const n=doorsOf(u),tag='علوي '+u.t+' '+u.w;doors+=n;hinges+=n*hingeOf(UH);const sh=u.t==='شفاط'?0:UH>=85?2:1;shelves+=sh;

function ktSVG(R){const H=+KT.lowH,UH=+KT.upH,gap=60,leg=10,TH=H+leg+UH+gap,sc=1.4;let x=0;const out=[];
 R.walls.forEach((w,wi)=>{const tot=Math.max(w.len,w.low.reduce((a,u)=>a+u.w,0)+w.tall.reduce((a,u)=>a+u.w,0));let lx=x;
  const box=(X,Y,Wd,Ht,u,kind)=>{let s=`<rect x="${X}" y="${Y}" width="${Wd}" height="${Ht}" rx="2" fill="${u.corner?'#eef5f6':'#fff'}" stroke="#087f8c" stroke-width="1.6"/>`;
   if(u.t==='أدراج'){for(let k=1;k<3;k++)s+=`<line x1="${X}" x2="${X+Wd}" y1="${Y+Ht*k/3}" y2="${Y+Ht*k/3}" stroke="#087f8c" stroke-width="1"/>`;for(let k=0;k<3;k++)s+=`<rect x="${X+Wd/2-9}" y="${Y+Ht*k/3+6}" width="18" height="3" rx="1.5" fill="#c9971f"/>`}
   else if(u.t==='شفاط'){s+=`<path d="M${X+6} ${Y+Ht} L${X+Wd/2-8} ${Y+8} L${X+Wd/2+8} ${Y+8} L${X+Wd-6} ${Y+Ht}" fill="#f4f8f9" stroke="#9aaeb4"/>`}
   else{const n=u.w>=80?2:1;if(n===2)s+=`<line x1="${X+Wd/2}" x2="${X+Wd/2}" y1="${Y}" y2="${Y+Ht}" stroke="#087f8c" stroke-width="1"/>`;for(let k=0;k<n;k++){const hx=n===2?(k?X+Wd/2+5:X+Wd/2-8):X+Wd-9;s+=`<rect x="${hx}" y="${kind==='up'?Y+Ht-22:Y+8}" width="3" height="14" rx="1.5" fill="#c9971f"/>`}}
   if(u.t==='حوض')s+=`<path d="M${X+Wd/2-14} ${Y-6} q14 -14 28 0" fill="none" stroke="#9aaeb4" stroke-width="2"/>`;
   return s+`<text x="${X+Wd/2}" y="${Y+Ht/2+4}" font-size="10" text-anchor="middle" fill="#0b4e57" font-family="Cairo">${u.w}</text>`};
  w.tall.forEach(u=>{out.push(box(lx,0,u.w,TH,u,'tall'));lx+=u.w});const ux0=lx;let ux=ux0;
  w.up.forEach(u=>{out.push(box(ux,0,u.w,UH,u,'up'));ux+=u.w});let dx=lx;
  w.low.forEach(u=>{out.push(box(dx,UH+gap,u.w,H,u,'low'));out.push(`<rect x="${dx+4}" y="${UH+gap+H}" width="3" height="${leg}" fill="#5b6b73"/><rect x="${dx+u.w-7}" y="${UH+gap+H}" width="3" height="${leg}" fill="#5b6b73"/>`);dx+=u.w});
  out.push(`<rect x="${lx}" y="${UH+gap-4}" width="${Math.max(0,dx-lx)}" height="4" fill="#c9971f" rx="1"/>`);
  out.push(`<line x1="${x}" x2="${x+tot}" y1="${TH+22}" y2="${TH+22}" stroke="#5b6b73" stroke-width="1" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="${x+tot/2}" y="${TH+36}" font-size="12" text-anchor="middle" fill="#0F2A37" font-family="Cairo" font-weight="700">حيطة ${wi+1}: ${w.len} سم${w.fill?' (فلر '+w.fill+')':''}</text>`);
  x+=tot+50});

function flRe(){const o=$('#flOut');if(!o)return;const R=flCalc(),A=S.cfg.arms;
 const rows=A.filter(a=>FL.kind==='two'?isFold(a):!isFold(a)).map(a=>{const dbl=FL.two&&/HK/.test(a.m),wt=dbl?R.w2:R.w1,lf=R.kh*wt,fit=lf>=a.lo&&lf<=a.hi,edge=fit&&(lf<a.lo*1.1||lf>a.hi*.9);return {a,lf,fit,edge}});
 const ok=rows.filter(r=>r.fit),gas=GAS.find(g=>R.w1<=g[0]);
 o.innerHTML=`<div class="grid">${KQ('box','وزن الضلفة',R.fw.toFixed(2)+' كجم','#087f8c',FL.mat+' · كثافة '+R.d)}${KQ('star',R.ex?'بالمقبض و'+esc(FL.exN||'الحاجة المتعلقة'):'بالمقبض',R.w1.toFixed(2)+' كجم','#c9971f',(R.ex?'منهم '+R.ex+' كجم '+esc(FL.exN||'')+' · ':'')+(FL.two?'بمقبضين: '+R.w2.toFixed(2)+' كجم':''))}${KQ('trend','معامل القوة LF',num(Math.round(R.kh*R.w1)),'#0b6e99','ارتفاع الدولاب '+R.kh+'مم × الوزن')}${KQ('wrench','الدراع الجاز (تقريبي)',gas?gas[1]+' × 2':'أكبر من 200N — استخدم مكانيزم','#5b6b73','للأدرعة الصيني — جرّب الأول')}</div>

 ${calcFlash('flOut')||''}<p style="font-size:12px;color:var(--mut);margin:8px 0 0">المعادلة من كتالوج بلوم: الوزن = الارتفاع × العرض × التخانة × الكثافة، و LF = ارتفاع الدولاب (مم) × وزن الضلفة بالمقبض (كجم). الأرقام محوّلة من كتالوجات وموزعين الشركات — اتأكد من كتالوج الموديل عند المورد، ولو الرقم على الحافة اعمل تجربة قبل التركيب.</p></div>`}

function flWa(){const R=flCalc(),ok=S.cfg.arms.filter(a=>FL.kind==='two'?isFold(a):!isFold(a)).filter(a=>{const lf=R.kh*((FL.two&&/HK/.test(a.m))?R.w2:R.w1);return lf>=a.lo&&lf<=a.hi});

  if(d.layout==='L'||d.layout==='U'){ox+=w.len*Math.cos(rot);oz-=w.len*Math.sin(rot);rot-=Math.PI/2}});
 return {items:out,walls}}

function dsSpec(d){const D2=d.dims,it=dsPlace(d).items;let doors=0,drawers=0,hinges=0,legs=0,shelves=0,handles=0,low=0,up=0,tall=0,gola=0;const hingeOf=h=>h<=95?2:h<=160?3:4;
 it.forEach(u=>{if(u.kind==='low'){low+=u.w;legs+=4;if(u.t==='أدراج'){drawers+=3;handles+=3}else if(!isDoorless(u.t)&&u.t!=='بوتاجاز'){const n=u.w>=80?2:1;doors+=n;hinges+=n*hingeOf(D2.lowH);handles+=n;if(u.t!=='حوض')shelves++}else if(u.t==='بوتاجاز'){drawers+=1;doors+=1;hinges+=2;handles+=2}}
  if(u.kind==='up'&&u.t!=='شفاط'){up+=u.w;if(u.t!=='رف مفتوح'){const n=u.w>=80?2:1;doors+=n;hinges+=n*hingeOf(D2.upH);handles+=n}shelves+=D2.upH>=85?2:1}
  if(u.kind==='tall'){tall++;legs+=4;if(u.t!=='تلاجة'){doors+=2;hinges+=hingeOf(D2.tallH*.38)+hingeOf(D2.tallH*.62);handles+=2;shelves+=4}}});
 if(d.style.handle==='gola'){gola=Math.ceil((low+up)/100*1.1);handles=0}if(d.style.handle==='push')handles=0;
 const c=S.cfg.kit,price=Math.round(low/100*c.lowP+up/100*c.upP+tall*c.tallP);return {doors,drawers,hinges,legs,shelves,handles,gola,lowM:low/100,upM:up/100,tall,top:Math.ceil(low/10)/10,slides:drawers,price}}

function account(){const s=SUB||{};openM(`<h3 style="margin:0 0 6px">👤 حسابي</h3><div style="line-height:2"><b>${H(USER.email)}</b><br>${H(s.shop||'')}<br>الحالة: <b>${s.status==='trial'?'فترة تجريبية':s.status==='active'?'مشترك':s.status==='admin'?'أدمن':'منتهي'}</b>${s.days_left!=null&&s.status!=='admin'?' — باقي '+s.days_left+' يوم':''}<br><small style="color:var(--mut)">البيانات بتتحفظ على السيرفر تلقائياً وتقدر تفتح من أي موبايل أو كمبيوتر بنفس الحساب.</small></div>
 ${s.status!=='admin'?payBtns():''}<div class="row" style="margin-top:12px"><button class="s" onclick="wmPush();toast('بنحفظ على السيرفر…','g')">☁️ احفظ دلوقتي</button><button class="s" onclick="wmExport()">⬇️ نسخة احتياطية</button><button class="s" onclick="wmPass()">🔑 تغيير كلمة السر</button><button class="s" onclick="wmReset()">🧹 ابدأ من جديد (فاضي)</button><button class="s" onclick="wmOut()">🚪 تسجيل خروج</button><button class="d" onclick="wmDel()">🗑️ حذف الحساب</button><button class="s" onclick="closeM()">إغلاق</button></div>`)}
window.wmReset=()=>ask('تمسح كل بيانات الحساب ده وتبدأ سيستم فاضي؟ (نزّل نسخة احتياطية الأول لو محتاجها)',async()=>{const fresh=seed();Object.keys(fresh.d).forEach(k=>fresh.d[k]=[]);fresh.cfg.name=(S.cfg&&S.cfg.name)||(SUB&&SUB.shop)||'';fresh.cfg.phone=(S.cfg&&S.cfg.phone)||'';fresh.cfg.addr=(S.cfg&&S.cfg.addr)||'';const at=new Date().toISOString();const r=await sb.from('wm_state').upsert({owner:USER.id,data:fresh,updated_at:at},{onConflict:'owner'});if(r.error)return alert(r.error.message);L('wmp2',JSON.stringify(fresh));L('wm_rev',at);location.reload()});
window.wmOut=async()=>{if(dirty)await push();await sb.auth.signOut();['wmp2','wm_rev','wm_owner'].forEach(k=>L(k,null));location.reload()};
window.wmDel=()=>ask('حذف الحساب وكل بياناته من السيرفر نهائياً؟ (نزّل نسخة احتياطية الأول لو محتاجها)',async()=>{const r=await sb.rpc('wm_delete_me');if(r.error)return alert(r.error.message);await sb.auth.signOut();['wmp2','wm_rev','wm_owner'].forEach(k=>L(k,null));location.href='mailto:'+MAIL+'?subject='+encodeURIComponent('حذف حساب WOODMASTER PRO')+'&body='+encodeURIComponent('برجاء حذف حسابي نهائياً: '+(USER&&USER.email));setTimeout(()=>location.reload(),800)});

/* ---------- شاشة الدخول ---------- */
const LOGO=`<i><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v18H3zM3 12h10M13 3v18M13 14h8M7 12V3"/></svg></i>`;
function box(inner,hard){let d=document.getElementById('wmAuth');if(!d){d=document.createElement('div');d.id='wmAuth';document.body.appendChild(d)}d.dataset.hard=hard?'1':'';d.innerHTML=`<div class="bx"><div class="lg">${LOGO}<div><b>WOODMASTER PRO</b><small>إدارة مصانع الأثاث والمطابخ والمعارض</small></div></div>${inner}</div>`}
function closeBox(){const d=document.getElementById('wmAuth');if(d)d.remove()}
function toast2(m,fn){if(typeof toast==='function')toast(m,'g');if(fn)setTimeout(fn,1500)}
function authUI(mode){mode=mode||'in';const up=mode==='up';
 box(`<div class="tabs"><button class="${up?'':'on'}" onclick="wmAuthUI('in')">تسجيل دخول</button><button class="${up?'on':''}" onclick="wmAuthUI('up')">حساب جديد — جرّب شهر مجاناً</button></div>
 <p>${up?'سجّل مصنعك أو ورشتك وجرّب كل حاجة شهر كامل مجاناً — من غير فيزا.':'ادخل بحسابك — بياناتك محفوظة على السيرفر ومتزامنة على كل أجهزتك.'}</p>
 ${up?`<label>اسمك</label><input id="wa_n" autocomplete="name"><label>اسم المصنع / الورشة / المعرض</label><input id="wa_s"><label>الموبايل</label><input id="wa_p" inputmode="tel" dir="ltr"><label>المحافظة</label><input id="wa_c" placeholder="دمياط، القاهرة…">`:''}
 <label>الإيميل</label><input id="wa_e" type="email" dir="ltr" autocomplete="email"><label>كلمة السر</label><input id="wa_w" type="password" dir="ltr" autocomplete="${up?'new-password':'current-password'}">
 <div class="err" id="wa_x"></div><button id="wa_go">${up?'✨ ابدأ التجربة المجانية':'دخول'}</button>${up?'':'<button class="lnk" onclick="wmForgot()">نسيت كلمة السر؟</button>'}
 <div class="ft"><span>📐 عروض أسعار وعقود</span><span>🍳 حاسبة مطابخ</span><span>🪚 تقطيع ألواح</span><span>🏭 متابعة الإنتاج</span><span>💹 ربحية المشاريع</span></div>
 <div style="text-align:center;margin-top:10px;font-size:12px"><a href="privacy.html" style="color:#64808F">سياسة الخصوصية</a> · <a href="terms.html" style="color:#64808F">الشروط</a></div>`);
 const go=document.getElementById('wa_go'),x=document.getElementById('wa_x'),v=id=>(document.getElementById(id)||{}).value||'';
 document.getElementById('wa_w').onkeydown=e=>{if(e.key==='Enter')go.click()};
 go.onclick=async()=>{const em=v('wa_e').trim(),pw=v('wa_w');x.className='err';if(!/^\S+@\S+\.\S+$/.test(em))return x.textContent='اكتب إيميل صحيح';if(pw.length<6)return x.textContent='كلمة السر ٦ حروف على الأقل';
  go.disabled=true;x.textContent='⏳';
  try{if(up){const n=v('wa_n').trim(),s=v('wa_s').trim();if(!n||!s){go.disabled=false;return x.textContent='اكتب اسمك واسم المصنع'}
    const r=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname,data:{app:'wm',name:n,shop:s,phone:v('wa_p').trim(),city:v('wa_c').trim(),src:PLAY?'play':''}}});if(r.error)throw r.error;if(r.data.user&&Array.isArray(r.data.user.identities)&&!r.data.user.identities.length){go.disabled=false;x.innerHTML='الإيميل ده متسجل قبل كده (ممكن في ميكانيكس). ادخل من «تسجيل دخول» بكلمة السر القديمة، أو دوس «نسيت كلمة السر» تحت.';return authExisting(em)}
    if(!r.data.session){x.className='err ok';x.textContent='✔ اتعمل الحساب — افتح الإيميل اللي وصلك ودوس على لينك التفعيل، وبعدين ادخل من هنا.';go.disabled=false;return}}
   else{const r=await sb.auth.signInWithPassword({email:em,password:pw});if(r.error)throw r.error}
   await boot()}catch(e){go.disabled=false;const m=String(e.message||e);x.textContent=/Invalid login/i.test(m)?'الإيميل أو كلمة السر غلط':/not confirmed/i.test(m)?'لسه مافعّلتش الحساب — افتح الإيميل ودوس اللينك':/already registered/i.test(m)?'الإيميل ده عنده حساب — ادخل بيه':/email rate limit/i.test(m)?'بعتنا إيميلات كتير الساعة دي — استنى حوالي ساعة وجرّب تاني':/rate limit/i.test(m)?'محاولات كتير — استنى دقيقة':m}}}
window.wmAuthUI=authUI;
function authExisting(em){setTimeout(()=>{authUI('in');const e=document.getElementById('wa_e');if(e)e.value=em;const x=document.getElementById('wa_x');if(x){x.textContent='الإيميل ده عنده حساب قبل كده — اكتب كلمة السر القديمة، أو دوس «نسيت كلمة السر» يوصلك لينك تغيّرها.'}},2500)}
window.wmForgot=async()=>{const em=(document.getElementById('wa_e')||{}).value||'',x=document.getElementById('wa_x');if(!/^\S+@\S+\.\S+$/.test(em.trim()))return x.textContent='اكتب الإيميل الأول';const r=await sb.auth.resetPasswordForEmail(em.trim(),{redirectTo:location.origin+location.pathname});if(r.error){x.className='err';x.textContent=/rate limit/i.test(r.error.message)?'بعتنا إيميلات كتير الساعة دي — استنى حوالي ساعة وجرّب تاني، أو استخدم آخر لينك وصلك':r.error.message;return}x.className='err ok';x.textContent='✔ بعتنالك لينك على الإيميل تغيّر منه كلمة السر (لو مالقيتوش بص في Spam)'};
function passUI(title){box(`<b>🔑 ${title||'كلمة سر جديدة'}</b><label>كلمة السر الجديدة</label><input id="wa_np" type="password" dir="ltr" autocomplete="new-password"><label>اكتبها تاني</label><input id="wa_np2" type="password" dir="ltr" autocomplete="new-password"><div class="err" id="wa_x"></div><button id="wa_ok">حفظ كلمة السر</button>${RECOV?'':'<button class="lnk" onclick="document.getElementById(\'wmAuth\').remove()">إلغاء</button>'}`,true);
 document.getElementById('wa_ok').onclick=async()=>{const p=document.getElementById('wa_np').value,p2=document.getElementById('wa_np2').value,x=document.getElementById('wa_x');if(p.length<6)return x.textContent='٦ حروف على الأقل';if(p!==p2)return x.textContent='الكلمتين مش زي بعض';
  const r=await sb.auth.updateUser({password:p});if(r.error)return x.textContent=r.error.message;x.className='err ok';x.textContent='✔ اتغيرت كلمة السر';const was=RECOV;RECOV=false;setTimeout(()=>{closeBox();if(was)boot()},900)}}
window.wmPass=()=>{closeM();passUI('تغيير كلمة السر')};
sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'){RECOV=true;passUI()}});
/* ---------- التشغيل ---------- */
async function boot(){const {data:{session}}=await sb.auth.getSession();USER=session&&session.user;if(!USER){if(!isPublic())authUI('in');return}
 if(RECOV){passUI();return}
 if(L('wm_owner')&&L('wm_owner')!==USER.id){['wmp2','wm_rev'].forEach(k=>L(k,null));L('wm_owner',USER.id);location.reload();return}
 try{await status();if(blockedWrite)return;closeBox();await pull(true);L('wm_owner',USER.id);chip()}catch(e){console.warn(e);if(!navigator.onLine){closeBox();toast2('مفيش نت — شغال من البيانات اللي على الجهاز وهيتحفظ أول ما النت يرجع')}else box(`<b>حصلت مشكلة في الاتصال</b><p>${H(e.message||e)}</p><button onclick="location.reload()">حاول تاني</button><button class="lnk" onclick="wmOut()">تسجيل خروج</button>`)}}
window.addEventListener('online',()=>{if(dirty)push()});
window.addEventListener('hashchange',()=>{if(isPublic()){const d=document.getElementById('wmAuth');if(d&&!d.dataset.hard)d.remove();return}if(!USER&&!document.getElementById('wmAuth'))authUI('in')});
if(!isPublic())box('<p style="text-align:center">⏳ بنجهّز حسابك…</p>');
boot();
})();
</script>
