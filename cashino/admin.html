<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>إدارة كاشينو</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f1f8f6;--card:#fff;--ink:#11302b;--mut:#5f7a74;--line:#dfece8;--pri:#0f9d74;--deep:#0e7490;--gold:#f2b51d;--bad:#e5484d}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(120deg,#10b981,#0e7490);color:#fff;padding:14px 16px;border-bottom:4px solid var(--gold);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{width:38px;height:38px;border-radius:10px}header h1{margin:0;font-size:20px;flex:1}header button{background:#ffffff26;color:#fff}
main{max-width:1200px;margin:0 auto;padding:16px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:7px 12px;cursor:pointer;background:var(--pri);color:#fff;font-size:13px}
button.s{background:#e2f5ef;color:#0b5e4a}button.d{background:#fde4e5;color:var(--bad)}button.g{background:#fff4d6;color:#8a6200}
input,select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.k{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.k small{color:var(--mut);display:block}.k b{font-size:22px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.bar input{max-width:300px}.bar select{max-width:190px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:10px;align-items:center}
.card .nm b{font-size:16px}.card small{color:var(--mut)}.tag{display:inline-block;border-radius:8px;padding:1px 9px;font-size:12px;font-weight:700}
.t-trial{background:#fff4d6;color:#8a6200}.t-active{background:#e2f5ef;color:#0b7a5c}.t-expired{background:#fde4e5;color:var(--bad)}.t-blocked{background:#333;color:#fff}
.acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
#login{max-width:380px;margin:60px auto;background:#fff;border-radius:18px;padding:22px;border-top:5px solid var(--gold);box-shadow:0 20px 40px #0001}
#login label{display:block;font-weight:700;font-size:13px;margin:8px 0 4px}#login button{width:100%;margin-top:12px;padding:11px}
.err{color:var(--bad);font-weight:700;font-size:13px;min-height:18px;margin-top:6px}
@media(max-width:760px){.card{grid-template-columns:1fr}.acts{justify-content:flex-start}}
</style>
</head>
<body>
<header><img src="icon-192.png" alt=""><h1>إدارة اشتراكات كاشينو</h1><button onclick="load()">↻ تحديث</button><button onclick="out()">خروج</button></header>
<main id="app"></main>
<script>
const sb=supabase.createClient('https://rzvncstjattlklpdtkfn.supabase.co','sb_publishable_Molr1fCzsC-VbSgTFDXc5w_F1p0-Fcr',{auth:{persistSession:true,storageKey:'cs-admin-auth'}});
const $=s=>document.querySelector(s),H=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=d=>d?new Date(d).toLocaleDateString('ar-EG',{day:'numeric',month:'short',year:'numeric'}):'—',ago=d=>{if(!d)return 'مافيش';const m=(Date.now()-new Date(d))/6e4;return m<60?'من '+Math.round(m)+' دقيقة':m<1440?'من '+Math.round(m/60)+' ساعة':'من '+Math.round(m/1440)+' يوم'};
const ph=p=>{p=String(p||'').replace(/\D/g,'');if(p.startsWith('0'))p='2'+p;return p};
let ROWS=[],Q='',F='all';
const st=r=>r.blocked?'blocked':(r.paid_until&&new Date(r.paid_until)>new Date())?'active':(new Date(r.trial_end)>new Date())?'trial':'expired';
const SL={trial:'تجربة',active:'مشترك',expired:'منتهي',blocked:'موقوف'};
const left=r=>{const e=st(r)==='active'?r.paid_until:r.trial_end;return Math.max(0,Math.ceil((new Date(e)-Date.now())/864e5))};
function loginUI(msg){$('#app').innerHTML=`<div id="login"><b style="font-size:19px">دخول الأدمن</b><label>الإيميل</label><input id="le" type="email" dir="ltr"><label>كلمة السر</label><input id="lp" type="password" dir="ltr"><div class="err" id="lx">${H(msg||'')}</div><button id="lg">دخول</button></div>`;
 $('#lp').onkeydown=e=>{if(e.key==='Enter')$('#lg').click()};$('#lg').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});if(r.error){const m=r.error.message||'';return $('#lx').textContent=/Invalid login/i.test(m)?'الإيميل أو كلمة السر غلط':/not confirmed/i.test(m)?'الإيميل لسه مش متفعّل':/rate|too many/i.test(m)?'محاولات كتير — استنى شوية':'حصلت مشكلة: '+m}load()}}
async function out(){await sb.auth.signOut();loginUI()}
async function load(){const {data:{session}}=await sb.auth.getSession();if(!session)return loginUI();
 const r=await sb.rpc('cash_admin_list');if(r.error){const m=r.error.message||'';if(/not_admin/.test(m)){await sb.auth.signOut();return loginUI('الحساب ده مش أدمن — ادخل بإيميل الأدمن')}return loginUI(/schema cache|Could not find/i.test(m)?'السيرفر بيتحدّث — دوس «تحديث» كمان دقيقة':/JWT|expired/i.test(m)?'الجلسة خلصت — ادخل تاني':'حصلت مشكلة: '+m)}ROWS=r.data||[];draw()}
function draw(){const c={all:ROWS.length,trial:0,active:0,expired:0,blocked:0};ROWS.forEach(r=>c[st(r)]++);
 const now=Date.now(),new7=ROWS.filter(r=>now-new Date(r.created_at)<7*864e5).length,act7=ROWS.filter(r=>r.last_seen&&now-new Date(r.last_seen)<7*864e5).length,soon=ROWS.filter(r=>st(r)==='trial'&&left(r)<=2).length;
 const L=ROWS.filter(r=>(F==='all'||st(r)===F||(F==='soon'&&st(r)==='trial'&&left(r)<=2))&&JSON.stringify(r).toLowerCase().includes(Q.toLowerCase()));
 $('#app').innerHTML=`<div class="kpis"><div class="k"><small>كل المكاتب</small><b>${c.all}</b></div><div class="k"><small>مشتركين</small><b style="color:#0b7a5c">${c.active}</b></div><div class="k"><small>في التجربة</small><b style="color:#8a6200">${c.trial}</b><small>${soon} تجربتهم بتخلص خلال يومين</small></div><div class="k"><small>منتهي / موقوف</small><b style="color:var(--bad)">${c.expired+c.blocked}</b></div><div class="k"><small>جداد آخر ٧ أيام</small><b>${new7}</b></div><div class="k"><small>نشطين آخر ٧ أيام</small><b>${act7}</b></div></div>
 <div class="bar"><input placeholder="🔎 بحث بالمكتب أو الإيميل أو الموبايل" value="${H(Q)}" oninput="Q=this.value;draw();this.focus();this.setSelectionRange(this.value.length,this.value.length)"><select onchange="F=this.value;draw()">${[['all','الكل'],['soon','تجربة بتخلص قريب'],['trial','تجربة'],['active','مشتركين'],['expired','منتهي'],['blocked','موقوف']].map(([k,l])=>`<option value="${k}" ${F===k?'selected':''}>${l}</option>`).join('')}</select></div>
 ${L.map(r=>{const s=st(r),nm=r.org_name||r.shop||'—';return `<div class="card"><div class="nm"><b>${H(nm)}</b> <span class="tag t-${s}">${SL[s]}${s==='trial'||s==='active'?' · '+left(r)+' يوم':''}</span><br><small><span dir="ltr">${H(r.email)}</span>${r.phone?' · <span dir="ltr">'+H(r.phone)+'</span>':''}${r.src==='play'?' · 📱 جوجل بلاي':''}</small>${r.note?`<br><small>📝 ${H(r.note)}</small>`:''}</div>
  <div><small>اتسجل</small> ${fd(r.created_at)}<br><small>آخر فتح</small> ${ago(r.last_seen)}<br><small>آخر حركة</small> ${ago(r.last_event)}</div>
  <div><small>الموظفين</small> <b>${r.members||0}</b> · <small>تحويلات</small> <b>${r.executed||0}</b> · <small>SMS</small> <b>${r.sms||0}</b><br><small>${r.paid_until?'مدفوع لحد '+fd(r.paid_until):'التجربة لحد '+fd(r.trial_end)} · ${r.events||0} حركة</small></div>
  <div class="acts"><button onclick="setS('${r.org}',30)">+ شهر</button><button onclick="setS('${r.org}',90)">+ ٣ شهور</button><button onclick="setS('${r.org}',365)">+ سنة</button><button class="g" onclick="trial('${r.org}')">+ أيام تجربة</button>
   ${r.phone?`<a href="https://wa.me/${ph(r.phone)}?text=${encodeURIComponent('أهلاً 👋 معاك فريق كاشينو — '+(s==='trial'?'إيه رأيك في التجربة لحد دلوقتي؟ لو محتاج مساعدة في أي حاجة إحنا معاك 🙏':s==='expired'?'التجربة خلصت وبياناتك محفوظة — تحب نفعّلك الاشتراك؟':'شكراً لاشتراكك 🙏'))}" target="_blank"><button class="s">💬</button></a>`:''}
   <button class="s" onclick="note('${r.org}')">📝</button><button class="s" onclick="setS('${r.org}',null,${!r.blocked})">${r.blocked?'▶️ فك الإيقاف':'⏸ إيقاف'}</button><button class="s" onclick="setS('${r.org}',0)" title="إلغاء الاشتراك المدفوع">↺</button></div></div>`}).join('')||'<div class="k">مفيش نتايج.</div>'}`}
async function setS(o,days,blocked){const r=await sb.rpc('cash_admin_set',{p_org:o,p_days:days,p_blocked:blocked===undefined?null:blocked,p_note:null,p_until:null});if(r.error)return alert(r.error.message);load()}
async function trial(o){const n=+prompt('كام يوم تجربة زيادة؟','7');if(!n)return;const r=await sb.rpc('cash_admin_trial',{p_org:o,p_days:n});if(r.error)return alert(r.error.message);load()}
async function note(o){const row=ROWS.find(x=>x.org===o),n=prompt('ملاحظة:',row.note||'');if(n===null)return;const r=await sb.rpc('cash_admin_set',{p_org:o,p_days:null,p_blocked:null,p_note:n,p_until:null});if(r.error)return alert(r.error.message);load()}
load();
</script>
</body>
</html>
